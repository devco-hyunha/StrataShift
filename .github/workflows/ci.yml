# p5-04 CI gate: pytest full suite + C1 forbidden-API check on every push/PR.
# Scope: stdlib + numpy only. Chain/smoke tests (HF models, engine binaries) skip via
# their existing skipif gates in CI — no model downloads, no engine builds here.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install (console entry gate)
        run: |
          python -m pip install .
          stratashift --help
      - name: C1 forbidden APIs in src (must be zero)
        run: |
          test "$(grep -rE 'safetensors\.torch\.load_file|torch\.load\(|state_dict' src/stratashift/ | wc -l)" = 0
      - name: C1 forbidden deps in pyproject (dependency entries only, tomllib-parsed)
        run: |
          python - <<'EOF'
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"].get("dependencies", [])
          banned = {"safetensors", "torch"}
          names = {d.split(">")[0].split("=")[0].strip() for d in deps}
          assert not (banned & names), f"C1 violation: {sorted(banned & names)}"
          print("C1 deps OK:", sorted(names))
          EOF
      - name: pytest full suite
        run: |
          python -m pip install pytest
          python -m pytest -q
